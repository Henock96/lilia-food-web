name: CI

# Validation bloquante du monorepo web (L0-7, blueprint Phase 3).
#
# Ce dépôt n'avait aucune CI : type-check, lint et tests ne tournaient que sur
# le poste de développement. La Phase 3 touche les deux apps (web client et
# admin) et le contrat partagé `@lilia/types` ; une régression de type entre
# eux ne doit plus pouvoir atteindre Vercel.
#
# Les deux apps sont aussi construites, avec une configuration synthétique sans
# secret et une API injoignable (`.invalid`) : la règle « le build n'appelle
# jamais le backend » (`connection()` + `Suspense`) devient vérifiée ici, au
# lieu d'être découverte par un déploiement Vercel en échec.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SEC-16 (audit du 18/11) : le `GITHUB_TOKEN` prenait les droits par défaut du
# dépôt. Aucun job n'écrit (ni push, ni commentaire, ni publication) : la
# lecture du code suffit. Un job qui en aurait besoin déclare ses propres droits.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version lue dans `packageManager` du package.json racine.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Types, lint, tests
        run: pnpm turbo type-check lint test

      - name: Builds web et admin sans backend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          API_URL: 'http://api.lilia.invalid'
          NEXT_PUBLIC_API_URL: 'http://api.lilia.invalid'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'synthetic-ci-test'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'ci-test.invalid'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'ci-test'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'ci-test.invalid'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:1234567890:web:synthetic'
        run: |
          pnpm --filter web build
          pnpm --filter admin build
